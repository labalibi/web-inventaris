version: '3.8'

services:
  # Database MySQL
  db:
    image: mysql:8.0
    container_name: inventaris_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: db_inventaris
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # GUI Pengelola Database (Adminer)
  adminer:
    image: adminer
    container_name: inventaris_adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  db_data: